; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ESP32-2432S024R "CYD" 2.4" 320x240 ILI9341, resistive XPT2046 touch (touch unused for now)
; Pins from F1ATB's ESP32-2432S028/024 LovyanGFX config. Some batches ship an ST7789:
; if the screen is garbled or inverted, add -DCYD_PANEL_ST7789 to build_flags.
[env:cyd24]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; CH340 on these boards can't keep up with the 460800 default.
upload_speed = 115200
; Auto-reset into the bootloader doesn't work on Tim's board: hold BOOT for the
; whole upload, and esptool must not reset it out of download mode.
upload_flags = --before=no_reset
; upload_port = COM19   ; set per PC if auto-detect picks the wrong port
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DBOARD_CYD24
  -DCYD_PANEL_ST7789
  -DWM_NODEBUG
  -DWM_MDNS
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Guition JC3636W518C (_I_Y): ESP32-S3 N16R8, 1.85" round 360x360 ST77916 (QSPI),
; CST816 capacitive touch. Native USB-C: upload should auto-reset (no BOOT holding).
[env:jc3636]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DBOARD_JC3636
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
lib_deps =
  lovyan03/LovyanGFX@^1.2.26
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
